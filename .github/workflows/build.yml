name: Build & Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android cmdline-tools
        run: |
          set -e
          CMDLINE_TOOLS_VERSION="11076708"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -sSL -o cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
            sudo apt-get install -y unzip
            sudo unzip -q cmdline-tools.zip -d /tmp/cmdline-tools-extract
            sudo mv /tmp/cmdline-tools-extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            sudo chmod -R 755 "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses
          sudo mkdir -p "$ANDROID_HOME/licenses"
          sudo cp "$(dirname $(which sdkmanager))/../licenses/"* "$ANDROID_HOME/licenses/" 2>/dev/null || true

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1 | tail -20

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract versionName
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT

      # A green build does not mean a green test suite: the workflow only ran
      # assembleDebug, so the JVM contract tests (alert gate, ego-pair
      # selection, upright-buffer indexing) never gated a release.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # The signing key is the app's identity. Before this the runner signed
      # with its own freshly generated debug keystore, so the released APK had a
      # DIFFERENT signer than any locally built one and could not be installed
      # over it ("signer changed" -> forced uninstall, app data lost). The
      # dedicated RoadGuard keystore is restored from a secret and used for
      # every variant.
      - name: Restore the RoadGuard signing key
        env:
          KEYSTORE_B64: ${{ secrets.ROADGUARD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ROADGUARD_KEYSTORE_BASE64 is not set — refusing to build an unsigned release" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/roadguard-release.jks"
          echo "ROADGUARD_KEYSTORE_PATH=$RUNNER_TEMP/signing/roadguard-release.jks" >> $GITHUB_ENV

      - name: Build signed APK
        env:
          ROADGUARD_KEYSTORE_PASSWORD: ${{ secrets.ROADGUARD_KEYSTORE_PASSWORD }}
          ROADGUARD_KEY_ALIAS: ${{ secrets.ROADGUARD_KEY_ALIAS }}
          ROADGUARD_KEY_PASSWORD: ${{ secrets.ROADGUARD_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Verify the signer
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -E 'Signer #1 certificate (DN|SHA-256)'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadGuard-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Download APK for release
        uses: actions/download-artifact@v4
        with:
          name: RoadGuard-${{ github.run_id }}
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RoadGuard v${{ steps.version.outputs.version }}
          body: |
            ## RoadGuard v${{ steps.version.outputs.version }}

            Built from commit `${{ github.sha }}`
            Triggered by: `${{ github.event_name }}`

            ### Changes
            See commits since last release.
          files: ./apk/app-debug.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
