name: Build & Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android cmdline-tools
        run: |
          set -e
          CMDLINE_TOOLS_VERSION="11076708"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -sSL -o cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
            sudo apt-get install -y unzip
            sudo unzip -q cmdline-tools.zip -d /tmp/cmdline-tools-extract
            sudo mv /tmp/cmdline-tools-extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            sudo chmod -R 755 "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses
          sudo mkdir -p "$ANDROID_HOME/licenses"
          sudo cp "$(dirname $(which sdkmanager))/../licenses/"* "$ANDROID_HOME/licenses/" 2>/dev/null || true

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1 | tail -20

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract versionName
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT

      # A green build does not mean a green test suite: the workflow only ran
      # assembleDebug, so the JVM contract tests (alert gate, ego-pair
      # selection, upright-buffer indexing) never gated a release.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # The signing key is the app's identity. Before this the runner signed
      # with its own freshly generated debug keystore, so the released APK had a
      # DIFFERENT signer than any locally built one and could not be installed
      # over it ("signer changed" -> forced uninstall, app data lost). The
      # dedicated RoadGuard keystore is restored from a secret and used for
      # every variant.
      - name: Restore the RoadGuard signing key
        env:
          KEYSTORE_B64: ${{ secrets.ROADGUARD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ROADGUARD_KEYSTORE_BASE64 is not set — refusing to build an unsigned release" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/roadguard-release.jks"
          echo "ROADGUARD_KEYSTORE_PATH=$RUNNER_TEMP/signing/roadguard-release.jks" >> $GITHUB_ENV

      - name: Build signed APK
        env:
          ROADGUARD_KEYSTORE_PASSWORD: ${{ secrets.ROADGUARD_KEYSTORE_PASSWORD }}
          ROADGUARD_KEY_ALIAS: ${{ secrets.ROADGUARD_KEY_ALIAS }}
          ROADGUARD_KEY_PASSWORD: ${{ secrets.ROADGUARD_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Verify the signer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          # Assert, don't print: a keystore secret holding the WRONG key would
          # otherwise sign, print a certificate and pass this step green.
          EXPECTED="9c4b19192c99348a215b10349aab1071cac0317e209b292d3accfb03ccca1c34"
          echo "apk: $APK"
          ls -l "$APK" || { echo "::error::$APK does not exist"; exit 1; }
          APKSIGNER=""
          for candidate in "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
                           $(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V -r); do
            if [ -x "$candidate" ]; then APKSIGNER="$candidate"; break; fi
          done
          if [ -z "$APKSIGNER" ]; then
            echo "::error::no apksigner under $ANDROID_HOME/build-tools"
            ls -l "$ANDROID_HOME/build-tools" || true
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          # Print the full verification output first: a missing/ambiguous
          # signature must be visible in the log, not swallowed by a pipe that
          # exits non-zero with nothing to show.
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}')
          echo "signer:   $ACTUAL"
          echo "expected: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::unexpected signer '$ACTUAL' (expected '$EXPECTED') - ROADGUARD_KEYSTORE_BASE64 holds the wrong keystore"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadGuard-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # One publisher only. The release is published from the build host
      # (see README, 'Release builds'): that is where the APK is built, its
      # sha256 is compared against the uploaded asset's digest, and the
      # DOWNLOADED file is installed on a device. Trying to also publish here
      # made CI run red on infrastructure rather than on the artifact - on a
      # tag whose release already exists, softprops/action-gh-release fails with
      # "Resource not accessible by integration" from the workflow token.
      # CI's job is the gate: tests, a signed build, and the signer check above.
      - name: Release ownership
        run: |
          echo "Release published from the build host (see README). This run gated:"
          echo "  - unit tests: passed"
          echo "  - signed APK: built with the RoadGuard key"
          echo "  - signer:     asserted against the expected fingerprint"
          echo "Build artifact: RoadGuard-${{ github.run_id }}"
